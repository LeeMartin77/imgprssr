name: Publish Tagged

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish-release-with-binary:
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build -r
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            target/release/imgprssr


  publish-container:
    needs: 
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up emulation
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: |
            ghcr.io/leemartin77/imgprssr:latest
            ghcr.io/leemartin77/imgprssr:${{ github.ref_name }}
          context: .
          platforms: linux/arm64/v8,linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/leemartin77/imgprssr:buildcache
          cache-to: type=registry,ref=ghcr.io/leemartin77/imgprssr:buildcache,mode=max